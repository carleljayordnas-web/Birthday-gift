<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1);
      color: white;
    }

    .container {
      width: 90%;
      max-width: 600px;
      text-align: center;
      padding: 35px 25px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      animation: appear 1.2s ease;
      z-index: 2;
    }

    .cake {
      font-size: 70px;
      animation: bounce 2s infinite;
    }

    h1 {
      font-size: clamp(2.2rem, 10vw, 4.5rem);
      margin: 10px 0;
      text-shadow: 0 0 15px rgba(255,255,255,0.7);
    }

    h2 {
      font-size: clamp(1.3rem, 5vw, 2rem);
      margin-bottom: 20px;
    }

    p {
      font-size: clamp(1rem, 4vw, 1.2rem);
      line-height: 1.7;
      margin-bottom: 25px;
    }

    button {
      border: none;
      padding: 14px 28px;
      border-radius: 50px;
      background: white;
      color: #d14d72;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    button:active {
      transform: scale(0.95);
    }

    .heart {
      position: fixed;
      font-size: 25px;
      animation: floatUp 5s linear forwards;
      pointer-events: none;
      z-index: 1;
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -20px;
      pointer-events: none;
      z-index: 10;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.8);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      .container {
        padding: 30px 18px;
      }

      .cake {
        font-size: 55px;
      }

      button {
        width: 100%;
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="cake">🎂</div>

    <h1>Happy Birthday!</h1>

    <h2>🎉 To Someone Special 🎉</h2>

    <p>
      Wishing you a wonderful birthday filled with
      happiness, laughter, love, and unforgettable moments!
      May all your dreams come true and may your special day
      be as amazing as you are. 💖
    </p>

    <button onclick="celebrate()">
      🎊 Celebrate! 🎊
    </button>
  </div>

  <script>
    const colors = [
      "#ff4757",
      "#ffa502",
      "#2ed573",
      "#1e90ff",
      "#a55eea",
      "#ff6b81",
      "#ffffff"
    ];

    function createConfetti(amount = 100) {
      for (let i = 0; i < amount; i++) {
        const confetti = document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.backgroundColor =
          colors[Math.floor(Math.random() * colors.length)];

        confetti.style.width = Math.random() * 8 + 6 + "px";
        confetti.style.height = Math.random() * 8 + 6 + "px";

        confetti.style.borderRadius =
          Math.random() > 0.5 ? "50%" : "2px";

        confetti.style.animationDuration =
          Math.random() * 3 + 3 + "s";

        confetti.style.animationDelay =
          Math.random() * 1.5 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 7000);
      }
    }

    function createHearts() {
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement("div");

        heart.classList.add("heart");
        heart.innerHTML = Math.random() > 0.5 ? "💖" : "✨";

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration =
          Math.random() * 3 + 4 + "s";

        heart.style.animationDelay =
          Math.random() * 2 + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 7000);
      }
    }

    function celebrate() {
      createConfetti(180);
      createHearts();
    }

    // Automatic confetti when the page opens
    window.onload = () => {
      setTimeout(() => {
        createConfetti(120);
      }, 500);
    };
  </script>

</body>
</html>
